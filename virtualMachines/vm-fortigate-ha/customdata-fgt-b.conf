config system sdn-connector
  edit "AzureSDN"
    set type azure
    set ha-status enable
  next
end
config router static
  edit 1
    set gateway 10.0.0.1
    set device port1
  next
  edit 2
    set dst 10.0.0.32/27
    set device port2
    set gateway 10.0.0.33
  next
  edit 3
    set dst 168.63.129.16 255.255.255.255
    set device port2
    set gateway 10.0.0.33
  next
  edit 4
    set dst 168.63.129.16 255.255.255.255
    set device port1
    set gateway 10.0.0.1
  next
  edit 5
    set dst 213.48.11.225 255.255.255.255
    set gateway 10.0.0.97
    set device port4
  next
end
config system probe-response
  set http-probe-value OK
  set mode http-probe
end
config system interface
  edit port1
    set mode static
    set ip 10.0.0.5/27
    set description external
    set allowaccess probe-response https
  next
  edit port2
    set mode static
    set ip 10.0.0.37/27
    set description internal
    set allowaccess probe-response
  next
  edit port3
    set mode static
    set ip 10.0.0.69/27
    set description hasyncport
  next
  edit port4
    set mode static
    set ip 10.0.0.101/27
    set description hammgmtport
    set allowaccess ping https ssh
  next
end
config system ha
  set group-id 0
  set group-name AzureHA
  set mode a-p
  set hbdev port3 100
  set session-pickup enable
  set session-pickup-connectionless enable
  set ha-mgmt-status enable
  config ha-mgmt-interfaces
    edit 1
      set interface port4
      set gateway 10.0.0.97
    next
  end
  set override disable
  set priority 1
  set unicast-hb enable
  set unicast-hb-peerip 10.0.0.68
end
