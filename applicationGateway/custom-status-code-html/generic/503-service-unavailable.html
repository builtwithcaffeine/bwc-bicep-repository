<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>503 - Service Unavailable</title>
  <style>
    :root { --accent: #facc15; --accent-2: #22c55e; --bg: #172554; --text: #fefce8; --muted: #fde68a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 18% 16%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 28rem), radial-gradient(circle at 82% 14%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 30rem), linear-gradient(135deg, #020617, var(--bg)); }
    main { width: min(100%, 46rem); border: 1px solid rgba(255,255,255,.14); border-radius: 2rem; padding: clamp(2rem, 5vw, 4rem); background: linear-gradient(145deg, rgba(23,37,84,.88), rgba(63,63,70,.52)); box-shadow: 0 2rem 6rem rgba(0,0,0,.38); backdrop-filter: blur(18px); }
    .eyebrow { display: inline-flex; gap: .55rem; align-items: center; padding: .45rem .8rem; border-radius: 999px; color: #fef9c3; background: rgba(250,204,21,.14); border: 1px solid rgba(253,224,71,.24); font-size: .84rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .pulse { width: .62rem; height: .62rem; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 .4rem color-mix(in srgb, var(--accent) 18%, transparent); }
    h1 { margin: 1.4rem 0 .8rem; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; letter-spacing: -.07em; }
    p { margin: 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.16rem); line-height: 1.75; }
    .hint { margin-top: 1.6rem; font-size: .92rem; color: #fef9c3; }
    code { color: #fef9c3; background: rgba(255,255,255,.08); padding: .15rem .38rem; border-radius: .4rem; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="eyebrow"><span class="pulse"></span>Status 503</div>
    <h1 id="page-title">Service unavailable</h1>
    <p>The service is temporarily unavailable, possibly due to maintenance or high demand. Please try again soon.</p>
    <p class="hint">If this keeps happening, share the status code <code>503</code> with support.</p>
  </main>
</body>
</html>
