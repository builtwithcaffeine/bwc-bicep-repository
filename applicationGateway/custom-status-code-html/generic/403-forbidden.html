<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>403 - Forbidden</title>
  <style>
    :root { --accent: #f59e0b; --accent-2: #ef4444; --bg: #111827; --text: #fff7ed; --muted: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 18% 16%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 28rem), radial-gradient(circle at 82% 10%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 28rem), linear-gradient(135deg, #020617, var(--bg)); }
    main { width: min(100%, 46rem); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 2rem; padding: clamp(2rem, 5vw, 4rem); background: linear-gradient(145deg, rgba(17,24,39,.9), rgba(30,41,59,.74)); box-shadow: 0 2rem 6rem rgba(0,0,0,.38); backdrop-filter: blur(18px); }
    main::before { content: ""; position: absolute; inset: -30% -20% auto auto; width: 25rem; height: 25rem; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); filter: blur(14px); }
    .content { position: relative; z-index: 1; }
    .eyebrow { display: inline-flex; gap: .55rem; align-items: center; padding: .45rem .8rem; border-radius: 999px; color: #ffedd5; background: rgba(245,158,11,.14); border: 1px solid rgba(251,191,36,.26); font-size: .84rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .pulse { width: .62rem; height: .62rem; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 .4rem color-mix(in srgb, var(--accent) 18%, transparent); }
    h1 { margin: 1.4rem 0 .8rem; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; letter-spacing: -.07em; }
    p { margin: 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.16rem); line-height: 1.75; }
    .hint { margin-top: 1.6rem; font-size: .92rem; color: #e2e8f0; }
    code { color: #ffedd5; background: rgba(255,255,255,.08); padding: .15rem .38rem; border-radius: .4rem; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="content">
      <div class="eyebrow"><span class="pulse"></span>Status 403</div>
      <h1 id="page-title">Access restricted</h1>
      <p>You do not currently have permission to view this page. Sign in with the right account or request access from the site owner.</p>
      <p class="hint">If you believe this is a mistake, share the status code <code>403</code> with support.</p>
    </div>
  </main>
</body>
</html>
