<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>400 - Bad Request</title>
  <style>
    :root { --accent: #38bdf8; --accent-2: #6366f1; --bg: #0f172a; --text: #e5eefb; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 32%, transparent), transparent 28rem), radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--accent-2) 34%, transparent), transparent 30rem), linear-gradient(135deg, #020617, var(--bg)); }
    main { width: min(100%, 46rem); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 2rem; padding: clamp(2rem, 5vw, 4rem); background: linear-gradient(145deg, rgba(15,23,42,.88), rgba(30,41,59,.72)); box-shadow: 0 2rem 6rem rgba(0,0,0,.36); backdrop-filter: blur(18px); }
    main::before { content: ""; position: absolute; inset: -35% auto auto -20%; width: 26rem; height: 26rem; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); filter: blur(12px); }
    .content { position: relative; z-index: 1; }
    .eyebrow { display: inline-flex; gap: .55rem; align-items: center; padding: .45rem .8rem; border-radius: 999px; color: #cffafe; background: rgba(14,165,233,.14); border: 1px solid rgba(125,211,252,.24); font-size: .84rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .pulse { width: .62rem; height: .62rem; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 .4rem color-mix(in srgb, var(--accent) 18%, transparent); }
    h1 { margin: 1.4rem 0 .8rem; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; letter-spacing: -.07em; }
    p { margin: 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.16rem); line-height: 1.75; }
    .hint { margin-top: 1.6rem; font-size: .92rem; color: #cbd5e1; }
    code { color: #e0f2fe; background: rgba(255,255,255,.08); padding: .15rem .38rem; border-radius: .4rem; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="content">
      <div class="eyebrow"><span class="pulse"></span>Status 400</div>
      <h1 id="page-title">Bad request</h1>
      <p>The request could not be processed because something about it looked incomplete or invalid. Check the address and try again.</p>
      <p class="hint">If this keeps happening, share the status code <code>400</code> with support.</p>
    </div>
  </main>
</body>
</html>
